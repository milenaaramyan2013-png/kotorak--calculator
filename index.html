
<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Կոտորակների հաշվիչ 💗</title>
<style>
body {
  background: pink;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}
.box {
  background: white;
  padding: 20px;
  border-radius: 20px;
  max-width: 360px;
  margin: auto;
}
h1 { color: deeppink; }
input, select, button {
  font-size: 18px;
  padding: 10px;
  margin: 6px;
  border-radius: 10px;
  border: 1px solid pink;
  box-sizing: border-box;
}
input { width: 90px; }
button {
  background: deeppink;
  color: white;
  border: none;
  cursor: pointer;
}
#result {
  color: purple;
  font-size: 23px;
  font-weight: bold;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
<div class="box">
  <h1>🧮 Կոտորակների հաշվիչ 💗</h1>
  <p>Առաջին կոտորակը</p>
  <input id="a" type="number" placeholder="Թվիչ">
  <br>—
  <br>
  <input id="b" type="number" placeholder="Հայտարար">

  <p>Գործողություն</p>
  <select id="op">
    <option value="+">Գումարում (+)</option>
    <option value="-">Հանում (−)</option>
    <option value="*">Բազմապատկում (×)</option>
    <option value="/">Բաժանում (÷)</option>
  </select>

  <p>Երկրորդ կոտորակը</p>
  <input id="c" type="number" placeholder="Թվիչ">
  <br>—
  <br>
  <input id="d" type="number" placeholder="Հայտարար">
  <br>
  <button onclick="calculate()">Հաշվել 💕</button>
  <p id="result">Պատասխանը՝</p>
</div>

<script>
function gcd(a, b) {
  a = Math.abs(a);
  b = Math.abs(b);
  while (b) {
    let t = b;
    b = a % b;
    a = t;
  }
  return a || 1;
}

function calculate() {
  let a = Number(document.getElementById("a").value);
  let b = Number(document.getElementById("b").value);
  let c = Number(document.getElementById("c").value);
  let d = Number(document.getElementById("d").value);
  let op = document.getElementById("op").value;
  let result = document.getElementById("result");

  if (
    document.getElementById("a").value === "" ||
    document.getElementById("b").value === "" ||
    document.getElementById("c").value === "" ||
    document.getElementById("d").value === ""
  ) {
    result.textContent = "Լրացրու բոլոր դաշտերը 💗";
    return;
  }

  if (b === 0 || d === 0) {
    result.textContent = "Հայտարարը չի կարող լինել 0։";
    return;
  }

  let n, den;

  if (op === "+") {
    n = a * d + c * b;
    den = b * d;
  } else if (op === "-") {
    n = a * d - c * b;
    den = b * d;
  } else if (op === "*") {
    n = a * c;
    den = b * d;
  } else {
    if (c === 0) {
      result.textContent = "0-ի բաժանել չի կարելի։";
      return;
    }
    n = a * d;
    den = b * c;
  }

  if (den < 0) {
    n = -n;
    den = -den;
  }

  let g = gcd(n, den);
  n /= g;
  den /= g;

  let answer = den === 1 ? String(n) : n + "/" + den;
  let decimal = n / den;

  result.textContent =
    "Պատասխան՝ " + answer +
    (den === 1 ? "" : " ≈ " + decimal.toFixed(4));
}
</script>
</body>
</html>
